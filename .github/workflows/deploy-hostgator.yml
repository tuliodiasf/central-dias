# Publica a Central na HostGator a cada gravação na branch main.
# Precisa dos secrets: FTP_SERVER (só para ativar), FTP_USERNAME, FTP_PASSWORD (e opcional FTP_DIR).
name: Publicar na HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir se o acesso FTP foi configurado
        id: chk
        env:
          S: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$S" ]; then echo "Secrets de FTP ainda não configurados. Nada publicado."; echo "ok=false" >> $GITHUB_OUTPUT; else echo "ok=true" >> $GITHUB_OUTPUT; fi

      - name: Definir servidor da HostGator
        if: steps.chk.outputs.ok == 'true'
        run: |
          # Servidor real da Central na HostGator (mesmo IP de central.diascentroautomotivo.com.br).
          # Atenção: ftp.diascentroautomotivo.com.br aponta para o Netlify (site da oficina), não serve.
          H=$(getent ahostsv4 central.diascentroautomotivo.com.br | awk '{print $1}' | head -1)
          [ -z "$H" ] && H=216.172.172.187
          echo "FTP_HOST=$H" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'

      - name: Enviar arquivos por FTP
        if: steps.chk.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          server-dir: ${{ secrets.FTP_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
