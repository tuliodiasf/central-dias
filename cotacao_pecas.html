<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotação de Peças · Dias</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --verm:#C8102E; --verm-d:#9E0C22; --preto:#141414; --cinza:#666; --linha:#e2e2e2; --amar:#8a6d00; --amar-bg:#fffbea; --amar-bd:#f0d98c; }
  *{box-sizing:border-box}
  body{margin:0;background:#eef0f3;color:#222;font-family:Arial,Helvetica,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .topo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topo img{height:40px}
  .topo .t1{font-size:18px;font-weight:900;color:var(--preto)}
  .topo .t2{font-size:12px;color:var(--cinza)}
  .info{display:flex;gap:8px 22px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--linha);font-size:13px}
  .info b{color:var(--preto)}
  .info .lb{font-size:10px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.04em;display:block}
  .prods{font-size:12.5px;color:#444;background:#f8f8f8;border:1px solid var(--linha);border-radius:8px;padding:10px 12px;margin-top:10px}
  .prods b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza)}
  .ficha{background:#f4f7fb;border:1px solid #d7e3f2;border-radius:8px;padding:10px 12px;margin-top:10px}
  .ficha .ft{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#2b5d92;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ficha .ft .fonte{font-weight:400;text-transform:none;letter-spacing:0;color:#7a8ba0;font-size:10.5px}
  .ficha .fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px 16px;font-size:12.5px}
  .ficha .fg .lb{font-size:10px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.04em;display:block}
  .ficha .fg b{color:var(--preto);font-weight:700;word-break:break-all}
  textarea{width:100%;min-height:58vh;padding:14px;border:1px solid var(--amar-bd);background:var(--amar-bg);border-radius:10px;font-size:14px;line-height:1.55;font-family:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--amar)}
  .acoes{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
  button.b{padding:11px 22px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;border:0}
  .b-salvar{background:#1d7a4d;color:#fff}
  .b-print{background:var(--verm);color:#fff}
  .b-copiar{background:#fff;color:#333;border:1px solid var(--linha)}
  .status{font-size:12.5px;color:var(--cinza);align-self:center;margin-right:auto}
  .status.ok{color:#1d7a4d;font-weight:700}
  .status.pend{color:#b45309;font-weight:700}
  .err{background:#fdeff0;border:1px solid #f3c1c7;color:#9E0C22;border-radius:10px;padding:12px 14px;font-weight:700;display:none}
  .sec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--amar);margin:0 0 8px}
  #print-area{display:none}
  @media print{
    @page{size:A4;margin:8mm}
    body{background:#fff}
    .wrap,.no-screen-hide{display:none!important}
    #print-area{display:block;font-size:9.5pt;color:#000}
    #print-area .ph{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--verm);padding-bottom:4px;margin-bottom:6px}
    #print-area .ph .t{font-size:13pt;font-weight:900}
    #print-area .ph img{height:26px}
    #print-area .pi{font-size:8.5pt;color:#333;margin-bottom:8px;white-space:pre-line}
    #print-area pre{white-space:pre-wrap;word-break:break-word;font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;line-height:1.45;margin:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="topo">
      <img src="logo.png" alt="Dias" onerror="this.style.display='none'">
      <div>
        <div class="t1">📝 Cotação de Peças — Rascunho</div>
        <div class="t2">Uso interno do setor de compras · não aparece no PDF do cliente nem no Relatório de Serviço</div>
      </div>
    </div>
    <div class="err" id="err"></div>
    <div class="info" id="info"></div>
    <div class="ficha" id="ficha" style="display:none"></div>
    <div class="prods" id="prods" style="display:none"></div>
  </div>

  <div class="card">
    <div class="sec">Rascunho livre — onde cotou, com quem negociou, condições combinadas, prazos, etc.</div>
    <textarea id="txt" placeholder="Ex.:&#10;Amortecedor dianteiro — Fornecedor X, R$ 280 cada, prazo 2 dias&#10;Kit embreagem — Fornecedor Y, R$ 540, à vista&#10;Pneus — aguardando retorno do Fornecedor Z..." oninput="marcaPendente()"></textarea>
    <div class="acoes">
      <span class="status" id="status">—</span>
      <button class="b b-copiar" onclick="copiarProdutos()">📋 Copiar produtos p/ cotação</button>
      <button class="b b-print" onclick="imprimir()">🖨️ Imprimir rascunho</button>
      <button class="b b-salvar" id="btn-salvar" onclick="salvar()">💾 Salvar rascunho</button>
    </div>
  </div>
</div>

<!-- Impressão: só cabeçalho compacto do orçamento + rascunho (economia de papel) -->
<div id="print-area">
  <div class="ph">
    <div class="t">Cotação de Peças · Rascunho</div>
    <img src="logo.png" onerror="this.style.display='none'">
  </div>
  <div class="pi" id="print-info"></div>
  <pre id="print-txt"></pre>
</div>

<script>
const SB_URL='https://lprogvakqrhnpvekggld.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxwcm9ndmFrcXJobnB2ZWtnZ2xkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MjI0MjgsImV4cCI6MjA5NTQ5ODQyOH0.UfbV-dRGDYx_Oe3VMQueQWEfo-_X-EEL12RdEZlhydo';
var supa = (window.supabase) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
var ORC=null, ID=new URLSearchParams(location.search).get('id'), sujo=false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function dtBR(v){ if(!v) return '—'; var p=String(v).split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):v; }
function erro(msg){ var e=document.getElementById('err'); e.style.display='block'; e.textContent=msg; }
function marcaPendente(){ sujo=true; var s=document.getElementById('status'); s.className='status pend'; s.textContent='✏️ Alterações não salvas'; }
function marcaSalvo(txt){ sujo=false; var s=document.getElementById('status'); s.className='status ok'; s.textContent=txt||'✅ Salvo'; }

async function carregar(){
  if(!supa){ erro('Sem conexão com o banco.'); return; }
  if(!ID){ erro('Orçamento não informado. Abra esta tela pelo botão "Cotação de peças" no orçamento.'); return; }
  var sess=await supa.auth.getSession();
  if(!sess.data || !sess.data.session){ erro('Você não está logado. Entre na Central primeiro e abra esta tela de novo.'); return; }
  var r=await supa.from('orcamentos').select('id,num,cli,placa,data,vend,val,itens,notas_cotacao').eq('id',ID).maybeSingle();
  if(r.error || !r.data){ erro('Orçamento não encontrado.'); return; }
  ORC=r.data;
  document.title='Cotação Nº '+(ORC.num||'')+' · Dias';
  document.getElementById('info').innerHTML=
    '<span><span class="lb">Nº Orçamento</span><b>'+esc(ORC.num||'—')+'</b></span>'
    +'<span><span class="lb">Cliente</span><b>'+esc(ORC.cli||'—')+'</b></span>'
    +'<span><span class="lb">Placa</span><b>'+esc(ORC.placa||'—')+'</b></span>'
    +'<span><span class="lb">Data</span><b>'+dtBR(ORC.data)+'</b></span>'
    +'<span><span class="lb">Vendedor</span><b>'+esc(ORC.vend||'—')+'</b></span>';
  var prods=(ORC.itens||[]).filter(function(it){ return it.tipo==='produto' && it.aprovado!==false; });
  if(prods.length){
    var pd=document.getElementById('prods'); pd.style.display='block';
    pd.innerHTML='<b>Peças deste orçamento:</b><br>'+prods.map(function(it,i){ return (i+1)+'. '+esc(it.descricao)+' — Qtd: '+(it.qtd||1); }).join('<br>');
  }
  document.getElementById('txt').value=ORC.notas_cotacao||'';
  marcaSalvo(ORC.notas_cotacao?'✅ Rascunho carregado':'— rascunho vazio, comece a anotar');
  buscarFicha(); // ficha técnica do veículo pela placa (não trava o carregamento do rascunho)
}

// ── FICHA TÉCNICA DO VEÍCULO (consulta-placa, com cache no servidor) ──
var FICHA=null;
async function buscarFicha(){
  var box=document.getElementById('ficha');
  try{
    var placa=(ORC&&ORC.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(placa)) return;
    var s=await supa.auth.getSession();
    var tk=(s.data&&s.data.session)?s.data.session.access_token:null;
    if(!tk) return;
    box.style.display='block';
    box.innerHTML='<div class="ft">🚗 Ficha do veículo <span class="fonte">🔎 buscando dados da placa '+esc(placa)+'...</span></div>';
    var r=await fetch(SB_URL+'/functions/v1/consulta-placa?placa='+placa,
      { headers:{ 'Authorization':'Bearer '+tk, 'apikey': SB_KEY } });
    var d=await r.json().catch(function(){return null;});
    if(!r.ok || !d || d.error){ box.innerHTML='<div class="ft">🚗 Ficha do veículo <span class="fonte">'+esc((d&&d.error)||'consulta indisponível no momento')+'</span></div>'; return; }
    FICHA=d.ficha||null;
    renderFicha(d);
  }catch(e){ console.error(e); box.style.display='none'; }
}
function renderFicha(d){
  var f=FICHA||{};
  function v(x){ return (x&&String(x).trim())?esc(String(x).trim()):'—'; }
  var anoFab=f.anoFabricacao||d.ano||'', anoMod=f.anoModelo||d.anoModelo||'';
  var anos=(anoFab&&anoMod&&anoFab!==anoMod)?(anoFab+'/'+anoMod):(anoMod||anoFab||'');
  var cil=(f.cilindradas&&String(f.cilindradas).trim())?(esc(String(f.cilindradas).trim())+' cc'):'—';
  var campos=[
    ['Marca', v(f.marca)],
    ['Modelo', v(f.modelo)],
    ['Versão', v(f.versao)],
    ['Submodelo', v(f.submodelo)],
    ['Cor', v(f.cor||d.cor)],
    ['Ano Fab./Modelo', v(anos)],
    ['Chassi', v(f.chassi)],
    ['Placa nova (Mercosul)', v(f.placaNova)],
    ['Placa antiga', v(f.placaAntiga)],
    ['Origem', v(f.origem)],
    ['Motor', v(f.motor)],
    ['Cilindradas', cil],
    ['Combustível', v(f.combustivel||d.combustivel)],
    ['Câmbio', v(f.cambio)]
  ];
  document.getElementById('ficha').innerHTML=
    '<div class="ft">🚗 Ficha do veículo <span class="fonte">consulta automática pela placa'+(d.cache?' · do cache (não gastou consulta)':'')+'</span></div>'
    +'<div class="fg">'+campos.map(function(c){ return '<span><span class="lb">'+c[0]+'</span><b>'+c[1]+'</b></span>'; }).join('')+'</div>';
}
function fichaResumoTexto(){
  var f=FICHA; if(!f) return '';
  var anos=(f.anoFabricacao&&f.anoModelo&&f.anoFabricacao!==f.anoModelo)?(f.anoFabricacao+'/'+f.anoModelo):(f.anoModelo||f.anoFabricacao||'');
  var l1=[f.marca,f.modelo].filter(Boolean).join(' ')+(f.versao?(' '+f.versao):'');
  var linhas=[];
  if(l1.trim()) linhas.push('Veículo: '+l1.trim()+(anos?(' · '+anos):'')+(f.cor?(' · '+f.cor):''));
  if(f.chassi) linhas.push('Chassi: '+f.chassi);
  var mot=[f.motor?('Motor '+f.motor):'', f.cilindradas?(f.cilindradas+' cc'):'', f.combustivel||'', f.cambio?('Câmbio '+f.cambio):''].filter(Boolean).join(' · ');
  if(mot) linhas.push(mot);
  return linhas.join('\n');
}

async function salvar(){
  if(!ORC) return;
  var btn=document.getElementById('btn-salvar'); btn.disabled=true; btn.textContent='Salvando...';
  var v=document.getElementById('txt').value;
  var r=await supa.from('orcamentos').update({ notas_cotacao: v||null }).eq('id',ORC.id).select('id');
  btn.disabled=false; btn.textContent='💾 Salvar rascunho';
  if(r.error || !r.data || !r.data.length){ erro('Não foi possível salvar: '+((r.error&&r.error.message)||'sem permissão')); return; }
  document.getElementById('err').style.display='none';
  ORC.notas_cotacao=v;
  marcaSalvo('✅ Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
}

function copiarProdutos(){
  var prods=(ORC&&ORC.itens||[]).filter(function(it){ return it.tipo==='produto' && it.aprovado!==false; });
  if(!prods.length){ alert('Nenhum produto neste orçamento.'); return; }
  var msg='Cotação de peças · Orçamento Nº '+(ORC.num||'')+(ORC.placa?(' · Placa '+ORC.placa):'')+'\n';
  var fr=fichaResumoTexto(); if(fr) msg+=fr+'\n';
  msg+='\n';
  prods.forEach(function(it,i){ msg+=(i+1)+'. '+it.descricao+' — Qtd: '+(it.qtd||1)+'\n'; });
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(function(){ marcaSalvo('📋 Produtos copiados! Cole no WhatsApp do fornecedor.'); }).catch(function(){ prompt('Copie a lista abaixo:', msg); });
  } else { prompt('Copie a lista abaixo:', msg); }
}

function imprimir(){
  if(!ORC) return;
  var v=document.getElementById('txt').value;
  if(!v.trim()){ alert('O rascunho está vazio — nada para imprimir.'); return; }
  var fr=fichaResumoTexto();
  document.getElementById('print-info').textContent=
    'Orçamento Nº '+(ORC.num||'—')+' · '+(ORC.cli||'—')+(ORC.placa?(' · Placa '+ORC.placa):'')+' · '+dtBR(ORC.data)
    +(ORC.vend?(' · Vendedor: '+ORC.vend):'')+' · impresso em '+new Date().toLocaleString('pt-BR')
    +(fr?('\n'+fr.replace(/\n/g,' · ')):'');
  document.getElementById('print-txt').textContent=v;
  document.title='COTACAO_'+(ORC.num||'');
  window.print();
}

// Ctrl+S salva; aviso ao fechar com alterações pendentes
document.addEventListener('keydown', function(e){ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); salvar(); } });
window.addEventListener('beforeunload', function(e){ if(sujo){ e.preventDefault(); e.returnValue=''; } });
carregar();
</script>
</body>
</html>
